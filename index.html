<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetario Manolo</title>
<meta name="description" content="Relevamiento de recetas y procedimientos de elaboración de la planta Churros Manolo.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recetario">
<style>
/* =====================================================================
   ESTILOS · Churros Manolo — línea sobria y profesional
   Neutros + rojo Manolo como acento. Modo claro y oscuro según el sistema.
   Se mantienen controles grandes (mín. ~52 px) para usar con una mano.
   ===================================================================== */
:root{
  color-scheme: light dark;
  --marca:#E00411; --marca-osc:#B5030E;
  --bg:#F5F5F6; --surface:#FFFFFF; --surface2:#F8F8F9;
  --text:#18181B; --muted:#5E5E66; --suave:#8A8A93; --border:#E3E3E7; --border-fuerte:#CFCFD6;
  --primary:#D7040F; --primary-hover:#B5030E; --primary-text:#FFFFFF;
  --tinta:#C2030E;                       /* rojo para texto/íconos sobre fondo claro */
  --tinte:#FDF0F0;                       /* fondo rojo muy suave */
  --focus:#D7040F;
  --danger:#B42318; --ok:#166534; --ok-bg:#E7F6EC; --info:#1E40AF; --info-bg:#E6EEFC;
  --warn:#8A4B00; --warn-bg:#FFF5DB; --ambar:#E0A21B;
  --neutro-bg:#F0F0F2;
  --sombra:0 1px 2px rgba(16,16,20,.05);
  --sombra-alta:0 8px 28px rgba(16,16,20,.12);
  --radio:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E0E10; --surface:#17171A; --surface2:#1D1D21; --text:#F2F2F4; --muted:#A6A6B0; --suave:#7D7D87;
    --border:#2A2A30; --border-fuerte:#3A3A42;
    --primary:#E00411; --primary-hover:#C2030E; --tinta:#FF6B70; --tinte:#2A1416; --focus:#FF6B70;
    --danger:#FF8A80; --ok:#7EE2A0; --ok-bg:#12291B; --info:#9DB9FF; --info-bg:#16213A;
    --warn:#F7C65C; --warn-bg:#2B2210; --ambar:#E0A21B; --neutro-bg:#24242A;
    --sombra:none; --sombra-alta:0 8px 28px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased}
h2{font-size:20px;margin:22px 0 8px;font-weight:700;letter-spacing:-.01em}
h3{font-size:17px;margin:16px 0 6px;font-weight:650}
a{color:var(--tinta)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* --- Íconos SVG de trazo --- */
.ic{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.grande{width:30px;height:30px}

/* --- Barra superior: blanca, logo rojo, línea de marca --- */
#barra{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:2px;
  padding:4px 6px;padding-top:calc(4px + env(safe-area-inset-top));
  background:var(--surface);color:var(--text);border-bottom:1px solid var(--border);
  box-shadow:inset 0 3px 0 var(--marca)}
#barra h1{flex:1;font-size:18px;font-weight:700;margin:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
#marca{display:flex;align-items:center;padding:0 4px 0 10px;min-height:52px}
#marca img{height:30px;width:auto;display:block}
.icono{display:inline-flex;align-items:center;justify-content:center;min-width:50px;min-height:50px;background:transparent;border:0;color:inherit;border-radius:10px;cursor:pointer}
.icono .ic{width:24px;height:24px}
.icono:active{background:var(--neutro-bg)}
main{max-width:760px;margin:0 auto;padding:16px 16px 24px}

/* --- Barra de acciones inferior --- */
#acciones{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;align-items:center;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border)}
#acciones:empty{display:none}
#acciones .btn{flex:1}
#acciones .btn.cuadrado{flex:0 0 54px;padding:0}
#estadoGuardado{flex:0 0 auto;font-size:13px;color:var(--suave);min-width:74px;line-height:1.2}

/* --- Botones: planos, rojo solo en la acción principal --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;
  border-radius:var(--radio);border:1px solid var(--primary);background:var(--primary);color:var(--primary-text);
  font:inherit;font-size:16px;font-weight:650;cursor:pointer;text-decoration:none;touch-action:manipulation;text-align:center;line-height:1.2;
  transition:background .12s,border-color .12s}
.btn:active{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--border-fuerte)}
.btn.sec:active{background:var(--neutro-bg)}
.btn.peligro{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.chico{min-height:46px;padding:0 12px;font-size:15px}
.btn.ancho{width:100%;margin:8px 0}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{background:none;border:0;padding:4px;color:var(--tinta);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px}
.bt-ic{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;border-radius:10px;
  border:1px solid var(--border-fuerte);background:var(--surface);color:var(--muted);cursor:pointer;flex:0 0 auto;padding:0}
.bt-ic:active{background:var(--neutro-bg)}
.bt-ic.x{color:var(--danger)}
.bt-ic[aria-expanded=true]{background:var(--tinte);border-color:var(--tinta);color:var(--tinta)}

/* --- Campos --- */
input,select,textarea{width:100%;font:inherit;font-size:17px;min-height:52px;padding:10px 12px;border:1px solid var(--border-fuerte);
  border-radius:10px;background:var(--surface);color:var(--text);transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--tinta);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--marca) 16%,transparent)}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--marca)}
::placeholder{color:var(--suave)}
.campo{display:block;margin:14px 0}
.campo > label,.lbl{display:block;font-weight:600;margin-bottom:6px;color:var(--muted);font-size:14px}
.fila{display:flex;gap:8px;align-items:flex-end}
.fila > *{flex:1;min-width:0}
.fila .campo{margin:6px 0}
.con-voz{display:flex;gap:8px;align-items:stretch}
.con-voz > input,.con-voz > textarea{flex:1;min-width:0}
.mic{flex:0 0 52px;min-height:52px;border-radius:10px;border:1px solid var(--border-fuerte);background:var(--surface);color:var(--tinta);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.mic:active{background:var(--tinte)}
.mic.escuchando{background:var(--marca);border-color:var(--marca);color:#fff;animation:latido 1.2s infinite}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--marca) 45%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
body.sin-voz .mic{display:none}
.check{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:500}

/* --- Tarjetas y secciones plegables --- */
.tarjeta{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--sombra)}
details.sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin:12px 0;padding:0 16px;box-shadow:var(--sombra)}
details.sec > summary{min-height:58px;display:flex;align-items:center;gap:10px;font-weight:650;font-size:17px;cursor:pointer;list-style:none}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--suave);border-bottom:2px solid var(--suave);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
details.sec[open] > summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
details.sec[open]{padding-bottom:16px}
details.sec[open] > summary{border-bottom:1px solid var(--border);margin-bottom:4px}
.cuenta{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--neutro-bg);color:var(--muted);font-size:13px;font-weight:650}
.cuenta:empty{display:none}

/* --- Chips (filtros, opciones, alérgenos) --- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips.desliza{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-right:-16px;padding-right:16px}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--border-fuerte);
  background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--tinte);border-color:var(--tinta);color:var(--tinta);font-weight:650}
.chip .ic{width:18px;height:18px}

/* --- Etiquetas de estado (suaves) --- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--neutro-bg);color:var(--muted)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.borrador{background:var(--warn-bg);color:var(--warn)}
.badge.a_validar{background:var(--info-bg);color:var(--info)}
.badge.validada{background:var(--ok-bg);color:var(--ok)}
.badge.vieja{background:var(--neutro-bg);color:var(--muted)}

/* --- Lista de recetas --- */
.item{display:block;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;margin:8px 0;box-shadow:var(--sombra)}
.item:active{background:var(--surface2)}
.item.vieja{opacity:.6}
.item-nombre{font-weight:650;font-size:17px;letter-spacing:-.005em}
.item-meta{color:var(--muted);font-size:14px;margin-top:2px}
.item .badges{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.resumen{color:var(--muted);margin:10px 0 4px;font-size:14px}
.vacio{text-align:center;color:var(--muted);padding:32px 10px}
.logo-vacio{width:72px;height:auto;margin-bottom:10px;opacity:.9}
.grupo{margin:22px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);font-weight:700}
.continuar{display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-left:4px solid var(--marca);
  border-radius:14px;padding:12px 16px;margin:0 0 12px;text-decoration:none;box-shadow:var(--sombra)}
.continuar b{display:block;font-size:17px;font-weight:650}
.continuar small{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.continuar .ic{margin-left:auto;color:var(--tinta)}

/* --- Avisos --- */
.aviso{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--ambar) 45%,transparent);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:15px;font-weight:500}
.aviso > .ic{margin-right:4px;vertical-align:-5px}
.aviso .btn{margin-top:10px;width:100%}

/* --- Ingredientes y pasos en el editor --- */
.ing,.paso{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;margin:8px 0}
.ing .fila,.paso .fila{margin-top:8px;align-items:center}
.ing input,.ing select,.paso input,.paso textarea{background:var(--surface)}
.ing .nota-prev{font-size:14px;color:var(--muted);margin:6px 2px 0}
.ing-extra{border-top:1px solid var(--border);margin-top:10px;padding-top:2px}
.ord{display:flex;gap:6px;flex:0 0 auto !important}
.num-paso{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--tinte);color:var(--tinta);
  font-weight:700;font-size:15px;flex:0 0 auto !important}
.dictado{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;margin:12px 0}
.dictado .lbl{display:flex;align-items:center;gap:6px;color:var(--text)}
.dictado textarea{min-height:96px}

/* --- Fotos --- */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0}
.foto{position:relative}
.foto img,.foto-paso img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--surface2);display:block;border:1px solid var(--border)}
.foto button,.foto-paso button{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.foto-paso{max-width:180px;position:relative;margin-top:8px}

/* --- Vista de lectura --- */
.lectura dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:8px 0;font-size:16px}
.lectura dt{font-weight:500;color:var(--muted)}
.lectura dd{margin:0;font-weight:500}
.lectura ul.ings{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.lectura ul.ings li{padding:12px 14px;border-bottom:1px solid var(--border)}
.lectura ul.ings li:last-child{border-bottom:0}
.lectura ul.ings ul.ings{border-radius:8px;margin-top:6px}
.lectura .cant{font-weight:700;display:inline-block;min-width:96px;font-variant-numeric:tabular-nums}
.lectura ol.pasos{padding-left:26px}
.lectura ol.pasos li{margin:12px 0;padding-left:4px}
.lectura ol.pasos li::marker{font-weight:700;color:var(--tinta)}
.det-paso{color:var(--muted);font-size:14px;margin-top:2px}
.texto-libre{white-space:pre-wrap}
.foto-portada{width:100%;max-height:280px;object-fit:cover;border-radius:14px;margin:0 0 12px;border:1px solid var(--border)}
details.sub{margin-top:6px}
details.sub summary{color:var(--tinta);font-weight:600;font-size:14px;min-height:40px;display:flex;align-items:center;cursor:pointer}

/* --- Modal y aviso flotante --- */
dialog{border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);padding:20px;width:min(520px,94vw);max-height:88vh;overflow:auto;box-shadow:var(--sombra-alta)}
dialog::backdrop{background:rgba(10,10,12,.5)}
dialog h2{margin-top:0;font-size:19px}
.botones-modal{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.botones-modal .btn{justify-content:flex-start}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));z-index:50;
  background:#18181B;color:#F4F4F5;padding:12px 16px;border-radius:12px;font-size:15px;font-weight:500;display:none;align-items:center;gap:12px;max-width:92vw;box-shadow:var(--sombra-alta)}
#toast.visible{display:flex}
#toast button{background:transparent;border:1px solid #52525B;color:#fff;border-radius:8px;min-height:40px;padding:0 12px;font:inherit;font-weight:650}

/* --- Menú --- */
.menu-mod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-mod .item{text-align:center;padding:18px 10px;font-weight:650}
.menu-mod .ic{display:block;margin:0 auto 8px;color:var(--tinta)}
.prox{opacity:.5}
.peq{font-size:14px;color:var(--muted)}
.menu-logo{display:block;width:64px;margin:24px auto 0;opacity:.9}

/* --- Modo cocina --- */
body.modo-cocina main{font-size:22px}
body.modo-cocina #acciones .btn{min-height:68px;font-size:19px}
.paso-cocina{font-size:28px;line-height:1.35;font-weight:600;margin:10px 0 18px;letter-spacing:-.01em}
.cocina .det-paso{font-size:19px}
.cocina .cant{min-width:120px}
.cocina-avance{height:4px;border-radius:99px;background:var(--border);overflow:hidden;margin:2px 0 14px}
.cocina-avance span{display:block;height:100%;background:var(--marca)}

/* --- Temporizador --- */
#timer{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:19;display:none;align-items:center;gap:10px;
  padding:8px 16px;background:#18181B;color:#F4F4F5;font-weight:600}
#timer.visible{display:flex}
#timer .t{font-size:28px;font-variant-numeric:tabular-nums;margin-left:auto;font-weight:700}
#timer button{min-height:44px;border-radius:8px;border:1px solid #52525B;background:transparent;color:#fff;font:inherit;padding:0 12px}
#timer.sonando{background:var(--marca);animation:parpadeo 1s infinite}
@keyframes parpadeo{50%{background:var(--marca-osc)}}

/* --- Ficha imprimible (siempre en colores de papel) --- */
.ficha{background:#fff;color:#111;border-radius:10px;padding:20px;font-size:14.5px;line-height:1.45;border:1px solid var(--border)}
.ficha h1{font-size:23px;margin:0;letter-spacing:-.01em}
.ficha h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid #ddd;color:#B5030E;margin:16px 0 6px;padding-bottom:4px}
.ficha-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid #E00411;padding-bottom:10px}
.ficha-cab p{margin:2px 0 0;color:#555}
.ficha-marca{text-align:right;font-weight:700;color:#222;font-size:12px;display:flex;align-items:center;gap:8px}
.ficha-marca img{height:36px;width:auto}
.ficha-marca span{display:block;font-weight:500;color:#666}
.ficha-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
.ficha-grid img{width:100%;max-height:220px;object-fit:cover;border-radius:6px}
.ficha dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;margin:4px 0}
.ficha dt{font-weight:600;color:#444}
.ficha dd{margin:0}
.ficha table{width:100%;border-collapse:collapse}
.ficha td{border-bottom:1px solid #e5e5e5;padding:5px 4px;vertical-align:top}
.ficha td.c{white-space:nowrap;font-weight:700;width:1%;font-variant-numeric:tabular-nums}
.ficha ol{padding-left:22px;margin:0}
.ficha ol li{margin:4px 0}
.ficha .alerg{border:1.5px solid #111;border-radius:4px;padding:4px 8px;font-weight:700;display:inline-block;margin:6px 0;font-size:13px;letter-spacing:.02em}
.ficha footer{margin-top:16px;border-top:1px solid #ddd;padding-top:6px;font-size:11.5px;color:#666}
@media (min-width:700px){.ficha-grid{grid-template-columns:3fr 2fr}.ficha-cols{display:grid;grid-template-columns:2fr 3fr;gap:20px}}

/* --- Impresión: solo la ficha, A4 --- */
@page{size:A4;margin:12mm}
@media print{
  body{padding:0;background:#fff;color:#000}
  #barra,#acciones,#toast,#timer,dialog{display:none !important}
  main{max-width:none;padding:0}
  .ficha{padding:0;font-size:10.5pt;border:0;border-radius:0}
  .ficha-grid{grid-template-columns:3fr 2fr}
  .ficha-cols{display:grid;grid-template-columns:2fr 3fr;gap:16px}
  .ficha section,.ficha li,.ficha tr{break-inside:avoid}
}
</style>
</head>
<body>
<!-- Íconos (SVG de trazo simple). Se usan con ic('nombre') desde el código. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-atras" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/></symbol>
  <symbol id="i-camara" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>

<script>
'use strict';
/* =====================================================================
   1. CONFIGURACIÓN
   Listas y constantes. Si querés agregar una categoría o unidad, es acá.
   ===================================================================== */
const APP_VERSION = '1.0.0';
const DB_NOMBRE = 'recetario-manolo';
const DB_VERSION = 1;
// Un store (tabla) por tipo de dato. 'insumos' queda listo para el costeo.
// Para un módulo nuevo (ej. POES) se agrega su store acá y se sube DB_VERSION.
const STORES = ['sectores', 'recetas', 'fotos', 'meta', 'insumos'];

const SECTORES_INICIALES = ['Pastelería / Repostería', 'Panadería', 'Pizzería', 'Cocina'];
const CATEGORIAS = ['Masa', 'Relleno', 'Cobertura / Baño', 'Almíbar / Jarabe', 'Producto terminado', 'Preparación base', 'Otro'];
const UNIDADES = ['g', 'kg', 'mL', 'L', 'unidad', 'cucharada', 'cucharadita', 'taza', 'pizca', 'a gusto'];
const NO_ESCALAN = ['pizca', 'a gusto'];        // estas unidades no se multiplican al escalar
const UNIDADES_RENDIMIENTO = ['kg', 'g', 'L', 'unidades', 'docenas', 'bandejas', 'porciones', 'moldes'];
const ESTADOS = { borrador: 'Borrador', a_validar: 'A validar', validada: 'Validada' };
const ALERGENOS = ['Gluten', 'Huevo', 'Leche', 'Frutos secos', 'Maní', 'Soja', 'Sésamo', 'Otros'];
const LUGARES_CONSERVACION = ['Ambiente', 'Cámara', 'Freezer'];
const DIAS_AVISO_RESPALDO = 3;                  // valor por defecto (se cambia en Ajustes)
const FOTO_MAX = 1280, FOTO_CALIDAD = 0.7;

// Menú principal de módulos. Para sumar uno nuevo: agregalo acá y creá su vista.
const MODULOS = [
  { id: 'recetas', nombre: 'Recetas', icono: 'libro', ruta: '#/', activo: true },
  { id: 'poes', nombre: 'POES / Limpieza', icono: 'limpieza', activo: false },
  { id: 'costeo', nombre: 'Costeo', icono: 'costo', activo: false },
];

/* =====================================================================
   2. BASE DE DATOS (IndexedDB con un wrapper chico)
   DB.get / DB.all / DB.put / DB.del / DB.clear devuelven promesas.
   ===================================================================== */
const DB = {
  db: null,
  abrir() {
    return new Promise((ok, mal) => {
      const req = indexedDB.open(DB_NOMBRE, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
      };
      req.onsuccess = () => { this.db = req.result; ok(); };
      req.onerror = () => mal(req.error);
    });
  },
  // Ejecuta una operación dentro de una transacción y espera a que se confirme en disco.
  _op(store, modo, fn) {
    return new Promise((ok, mal) => {
      const tx = this.db.transaction(store, modo);
      const r = fn(tx.objectStore(store));
      tx.oncomplete = () => ok(r && r.result);
      tx.onerror = () => mal(tx.error);
      tx.onabort = () => mal(tx.error || new Error('Transacción cancelada'));
    });
  },
  get(s, id) { return this._op(s, 'readonly', st => st.get(id)); },
  all(s) { return this._op(s, 'readonly', st => st.getAll()); },
  put(s, obj) { return this._op(s, 'readwrite', st => st.put(obj)); },
  del(s, id) { return this._op(s, 'readwrite', st => st.delete(id)); },
  clear(s) { return this._op(s, 'readwrite', st => st.clear()); },
  putVarios(s, lista) { return this._op(s, 'readwrite', st => { lista.forEach(o => st.put(o)); }); },
};

/* =====================================================================
   3. UTILIDADES
   ===================================================================== */
const $ = (sel, raiz = document) => raiz.querySelector(sel);
const $$ = (sel, raiz = document) => [...raiz.querySelectorAll(sel)];
const app = $('#app');
// Ícono SVG del sprite de arriba: ic('camara'), ic('mas', 'grande')…
const ic = (nombre, clase = '') => `<svg class="ic ${clase}" aria-hidden="true"><use href="#i-${nombre}"/></svg>`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const capitalizar = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'sin-nombre';
const hoyISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fmtFecha = iso => iso ? new Date(iso.length === 10 ? iso + 'T12:00' : iso).toLocaleDateString('es-AR') : '';
const diasDesde = iso => iso ? Math.floor((Date.now() - new Date(iso)) / 86400000) : null;
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;

// Convierte texto a número aceptando "1,5", "1.5", "1/2", "1 1/2", "½" y "1.500" (miles).
function parseNum(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/\s+/g, ' ');
  if (!s) return null;
  const frac = { '½': .5, '¼': .25, '¾': .75, '⅓': 1 / 3, '⅔': 2 / 3 };
  if (frac[s]) return frac[s];
  let m = s.match(/^(\d+)\s*([½¼¾⅓⅔])$/); if (m) return +m[1] + frac[m[2]];
  m = s.match(/^(\d+) (\d+)\/(\d+)$/); if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d+)\/(\d+)$/); if (m) return m[1] / m[2];
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');   // 1.500 → 1500
  const n = parseFloat(s.replace(',', '.'));
  return isNaN(n) ? null : n;
}
// Número lindo en formato argentino, con decimales según el tamaño.
function fmtNum(n) {
  if (n == null || isNaN(n)) return '';
  const a = Math.abs(n), dec = a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3;
  return Number(n.toFixed(dec)).toLocaleString('es-AR', { maximumFractionDigits: dec });
}
const numAInput = n => n == null ? '' : String(n).replace('.', ',');

// Leer/escribir propiedades anidadas con un "camino": 'rendimiento.cantidad', 'pasos.2.texto'
const getPath = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
function setPath(o, p, v) {
  const ks = p.split('.'); const ult = ks.pop();
  const dest = ks.reduce((a, k) => a[k] ??= {}, o);
  dest[ult] = v;
}
function mover(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return false; [arr[i], arr[j]] = [arr[j], arr[i]]; return true; }

// Aviso flotante abajo. Opcional: un botón de acción (ej. "Deshacer").
let toastTimer;
function toast(msg, { accion, fn, ms = 3000 } = {}) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (accion ? `<button type="button">${esc(accion)}</button>` : '');
  if (accion) t.querySelector('button').onclick = () => { t.classList.remove('visible'); fn(); };
  t.classList.add('visible');
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => t.classList.remove('visible'), accion ? Math.max(ms, 5000) : ms);
}

// Ventana modal genérica. Devuelve una promesa con el "valor" del botón tocado (o null si se cancela).
function modal({ titulo, cuerpo = '', botones = [{ txt: 'Aceptar', valor: true }], alAbrir }) {
  const d = $('#modal');
  d.innerHTML = `<h2>${esc(titulo)}</h2><div class="cuerpo-modal">${cuerpo}</div>
    <div class="botones-modal">${botones.map((b, i) => `<button type="button" class="btn ${b.clase || ''}" data-i="${i}">${b.ico ? ic(b.ico) : ''}${esc(b.txt)}</button>`).join('')}</div>`;
  return new Promise(ok => {
    let valor = null;
    d.querySelectorAll('.botones-modal button').forEach(b => b.onclick = () => { valor = botones[+b.dataset.i].valor; d.close(); });
    d.onclose = () => { Voz.detener(); ok(valor); };
    d.showModal();
    alAbrir && alAbrir(d);
  });
}
async function confirmar(msg, { si = 'Sí', no = 'Cancelar', peligro = false, titulo = '¿Seguro?' } = {}) {
  return await modal({ titulo, cuerpo: `<p>${esc(msg)}</p>`, botones: [{ txt: si, valor: true, clase: peligro ? 'peligro' : '' }, { txt: no, valor: false, clase: 'sec' }] }) === true;
}
async function pedirTexto(titulo, inicial = '', ph = '') {
  let input;
  const r = await modal({
    titulo, cuerpo: `<div class="con-voz"><input id="mTexto" value="${esc(inicial)}" placeholder="${esc(ph)}">${MIC}</div>`,
    botones: [{ txt: 'Guardar', valor: true }, { txt: 'Cancelar', valor: false, clase: 'sec' }],
    alAbrir: d => { input = $('#mTexto', d); input.onkeydown = e => { if (e.key === 'Enter') d.querySelector('[data-i="0"]').click(); }; },
  });
  return r ? input.value.trim() : null;
}
// Descarga un archivo (fallback cuando no se puede compartir).
function descargar(blob, nombre) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/* =====================================================================
   4. ESTADO EN MEMORIA Y GUARDADO
   S guarda una copia en memoria de lo que hay en la base para dibujar rápido.
   Toda modificación pasa por guardarReceta() / guardarSector().
   ===================================================================== */
const S = {
  sectores: [], recetas: [], meta: {},
  filtros: { q: '', sector: '', categoria: '', estado: '' },
  escala: {},          // factor de escalado por receta (solo en memoria)
  persistido: null,
};
async function cargarTodo() {
  S.sectores = (await DB.all('sectores')).sort((a, b) => a.orden - b.orden);
  S.recetas = await DB.all('recetas');
  S.meta = Object.fromEntries((await DB.all('meta')).map(m => [m.id, m.valor]));
}
const getReceta = id => S.recetas.find(r => r.id === id);
const getSector = id => S.sectores.find(s => s.id === id);
const nombreSector = id => getSector(id)?.nombre || 'Sin sector';
async function setMeta(id, valor) { S.meta[id] = valor; await DB.put('meta', { id, valor }); }

async function guardarReceta(r, { tocar = true } = {}) {
  if (tocar) r.modificada = new Date().toISOString();
  await DB.put('recetas', r);
  const i = S.recetas.findIndex(x => x.id === r.id);
  if (i < 0) S.recetas.push(r); else S.recetas[i] = r;
}
async function borrarReceta(r) {
  for (const fid of idsFotosDeReceta(r)) await DB.del('fotos', fid);
  await DB.del('recetas', r.id);
  S.recetas = S.recetas.filter(x => x.id !== r.id);
}
async function guardarSector(s) {
  await DB.put('sectores', s);
  if (!S.sectores.includes(s)) S.sectores.push(s);
}

// Autoguardado: cada cambio programa un guardado a los 400 ms.
// Además se fuerza el guardado al salir de la pantalla o al minimizar la app.
const Autoguardado = {
  pendiente: null, timer: null,
  programar(r) {
    this.pendiente = r; clearTimeout(this.timer);
    marcarGuardado('Guardando…');
    this.timer = setTimeout(() => this.flush(), 400);
  },
  async flush() {
    clearTimeout(this.timer);
    const r = this.pendiente; this.pendiente = null;
    if (!r) return;
    try { await guardarReceta(r); marcarGuardado('✓ Guardado'); }
    catch (e) { this.pendiente = r; marcarGuardado('⚠ Sin guardar'); toast('¡Ojo! No se pudo guardar: ' + e.message, { ms: 8000 }); }
  },
};
function marcarGuardado(txt) { const e = $('#estadoGuardado'); if (e) e.textContent = txt; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Autoguardado.flush(); });
window.addEventListener('pagehide', () => Autoguardado.flush());

// Plantillas de objetos vacíos (el "modelo de datos").
function recetaVacia(sectorId) {
  const ahora = new Date().toISOString();
  return {
    id: uid(), esquema: 1, sectorId, nombre: '', categoria: '', estado: 'borrador', versionVieja: false,
    rendimiento: { cantidad: null, unidad: 'kg', pesoUnidad: null },
    ingredientes: [], pasos: [],
    equipos: '', utensilios: '',
    coccion: { horno: '', temp: '', tiempo: '', bandejasTanda: '', reposo: '' },
    alergenos: [],
    conservacion: { donde: '', temp: '', vidaUtil: '' },
    puntosCriticos: '', variaciones: '',
    fuente: { operario: '', fecha: hoyISO(), tipo: 'declarado' },   // tipo: 'observado' | 'declarado'
    fotoIds: [], creada: ahora, modificada: ahora,
  };
}
// subRecetaId: id de otra receta si el ingrediente es una sub-receta.
// esSubReceta + sin subRecetaId = sub-receta que todavía no existe.
// precio / insumoId: reservados para el costeo (todavía no se usan).
const ingredienteVacio = () => ({ id: uid(), cantidad: null, unidad: 'g', nombre: '', nota: '', esSubReceta: false, subRecetaId: null });
const pasoVacio = () => ({ id: uid(), texto: '', tiempoMin: null, temp: '', equipo: '', fotoId: null });
const recetaEstaVacia = r => !r.nombre.trim() && !r.ingredientes.length && !r.pasos.length && !r.fotoIds.length;

/* =====================================================================
   5. FOTOS (comprimidas con canvas y guardadas como Blob en IndexedDB)
   ===================================================================== */
// Abre la cámara (camara=true) o la galería.
function elegirFotos(camara) {
  return new Promise(ok => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    if (camara) inp.setAttribute('capture', 'environment'); else inp.multiple = true;
    inp.onchange = () => ok([...inp.files]);
    inp.click();
  });
}
async function comprimirFoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('No se pudo leer la imagen')); i.src = url; });
    const k = Math.min(1, FOTO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(ok, 'image/jpeg', FOTO_CALIDAD));
  } finally { URL.revokeObjectURL(url); }
}
async function guardarFoto(recetaId, file) {
  const blob = await comprimirFoto(file);
  const id = uid();
  await DB.put('fotos', { id, recetaId, blob, creada: new Date().toISOString() });
  return id;
}
async function borrarFoto(id) { await DB.del('fotos', id); const u = urlsFotos.get(id); if (u) { URL.revokeObjectURL(u); urlsFotos.delete(id); } }
const idsFotosDeReceta = r => [...r.fotoIds, ...r.pasos.map(p => p.fotoId).filter(Boolean)];
// Las <img data-foto="id"> se completan después de dibujar (las fotos se leen de la base).
const urlsFotos = new Map();
async function hidratarFotos(raiz = document) {
  for (const img of $$('img[data-foto]', raiz)) {
    const id = img.dataset.foto;
    let u = urlsFotos.get(id);
    if (!u) { const f = await DB.get('fotos', id); if (!f) continue; u = URL.createObjectURL(f.blob); urlsFotos.set(id, u); }
    img.src = u;
  }
}

/* =====================================================================
   6. DICTADO POR VOZ (Web Speech API, es-AR)
   Cualquier botón con data-mic dicta en el input/textarea que tiene al lado.
   Si el navegador no lo soporta, los botones se ocultan (clase body.sin-voz).
   ===================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) document.body.classList.add('sin-voz');
const Voz = {
  rec: null, btn: null,
  iniciar(btn) {
    const mismo = this.btn === btn;
    if (this.rec) { this.detener(); if (mismo) return; }
    const campo = btn.parentElement.querySelector('input,textarea');
    const rec = new SR();
    rec.lang = 'es-AR'; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onresult = e => {
      let t = '';
      for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) t += e.results[i][0].transcript;
      t = t.trim(); if (!t) return;
      const v = campo.value;
      const sep = !v ? '' : campo.dataset.lineas ? (v.endsWith('\n') ? '' : '\n') : (/\s$/.test(v) ? '' : ' ');
      campo.value = v + sep + (v && !campo.dataset.lineas ? t : capitalizar(t));
      campo.dispatchEvent(new Event('input', { bubbles: true }));
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Permití el uso del micrófono para dictar.');
      else if (e.error === 'network') toast('El dictado de este navegador necesita internet. Sin señal, usá el micrófono del teclado.', { ms: 6000 });
      else if (e.error !== 'no-speech' && e.error !== 'aborted') toast('Error de dictado: ' + e.error);
    };
    rec.onend = () => { btn.classList.remove('escuchando'); if (this.rec === rec) { this.rec = null; this.btn = null; } };
    this.rec = rec; this.btn = btn;
    btn.classList.add('escuchando');
    try { rec.start(); } catch (e) { rec.onend(); }
  },
  detener() { if (this.rec) { try { this.rec.stop(); } catch (e) { } } },
};

/* =====================================================================
   7. ACCIONES Y NAVEGACIÓN
   Los botones llevan data-acc="nombre". Cada vista define sus acciones en
   accionesVista; las de accionesGlobales sirven en todas las pantallas.
   ===================================================================== */
let accionesVista = {};
const accionesGlobales = {
  irMenu: () => location.hash = '#/menu',
  async nuevaReceta() {
    if (!S.sectores.length) { toast('Primero creá un sector.'); location.hash = '#/sectores'; return; }
    const r = recetaVacia(S.filtros.sector || S.sectores[0].id);
    await guardarReceta(r);
    location.hash = '#/editar/' + r.id;
  },
  respaldar: () => hacerRespaldo(),
  timerDetener: () => Temporizador.detener(),
};
document.addEventListener('click', e => {
  const mic = e.target.closest('[data-mic]');
  if (mic) { e.preventDefault(); Voz.iniciar(mic); return; }
  const b = e.target.closest('[data-acc]');
  if (!b) return;
  const fn = accionesVista[b.dataset.acc] || accionesGlobales[b.dataset.acc];
  if (fn) { e.preventDefault(); fn(b, e); }
});

const RUTAS = [
  [/^#?\/?$/, () => vistaInicio()],
  [/^#\/menu$/, () => vistaMenu()],
  [/^#\/sectores$/, () => vistaSectores()],
  [/^#\/receta\/([\w-]+)$/, id => vistaReceta(id)],
  [/^#\/editar\/([\w-]+)$/, id => vistaEditar(id)],
  [/^#\/cocina\/([\w-]+)$/, id => vistaCocina(id)],
  [/^#\/ficha\/([\w-]+)$/, id => vistaFicha(id)],
  [/^#\/respaldo$/, () => vistaRespaldo()],
  [/^#\/ajustes$/, () => vistaAjustes()],
];
// "Padre" de cada pantalla, para el botón ← cuando no hay historial.
function rutaPadre(h) {
  let m;
  if ((m = h.match(/^#\/(editar|cocina|ficha)\/([\w-]+)/))) return '#/receta/' + m[2];
  return '#/';
}
let navInternas = 0, recetaEditando = null;
async function navegar() {
  await Autoguardado.flush();
  Voz.detener();
  // Si salís del editor con una receta totalmente vacía, se descarta.
  if (recetaEditando) {
    const r = getReceta(recetaEditando); recetaEditando = null;
    if (r && recetaEstaVacia(r)) await borrarReceta(r);
  }
  if (typeof salirModoCocina === 'function') salirModoCocina();
  accionesVista = {}; app.oninput = app.onchange = null;
  const h = location.hash || '#/';
  for (const [re, fn] of RUTAS) {
    const m = h.match(re);
    if (m) { window.scrollTo(0, 0); await fn(...m.slice(1)); return; }
  }
  location.replace('#/');
}
window.addEventListener('hashchange', () => { navInternas++; navegar(); });
$('#btnAtras').onclick = () => {
  if (navInternas > 0) { navInternas -= 2; history.back(); }  // -2: el back dispara otro hashchange
  else location.replace(rutaPadre(location.hash));
};
function setHeader(titulo, atras = true) {
  $('#titulo').textContent = titulo;
  // En el inicio se ve el logo; en las demás pantallas, la flecha para volver.
  $('#btnAtras').style.display = atras ? '' : 'none';
  $('#marca').style.display = atras ? 'none' : '';
  document.title = titulo + ' · Recetario';
}
const setAcciones = html => $('#acciones').innerHTML = html;
function noEncontrada() { setHeader('No encontrada'); app.innerHTML = '<p class="vacio">Esa receta no existe (¿se borró?).</p><a class="btn ancho" href="#/">Ir al inicio</a>'; setAcciones(''); }

/* =====================================================================
   8. PIEZAS DE FORMULARIO REUTILIZABLES
   Todo campo con data-f="camino" se guarda solo en la receta (ver vistaEditar).
   ===================================================================== */
const idCampo = f => 'f-' + f.replace(/\./g, '-');
const MIC = `<button type="button" class="mic" data-mic aria-label="Dictar por voz">${ic('mic')}</button>`;
function cTexto(f, valor, { label, ph = '', area = false, lineas = false, voz = true, lista = '' } = {}) {
  const ctl = area
    ? `<textarea id="${idCampo(f)}" data-f="${f}" placeholder="${esc(ph)}" ${lineas ? 'data-lineas="1"' : ''}>${esc(valor)}</textarea>`
    : `<input id="${idCampo(f)}" data-f="${f}" value="${esc(valor)}" placeholder="${esc(ph)}" ${lista ? `list="${lista}"` : ''} autocomplete="off">`;
  return `<div class="campo">${label ? `<label for="${idCampo(f)}">${label}</label>` : ''}<div class="con-voz">${ctl}${voz ? MIC : ''}</div></div>`;
}
function cNum(f, valor, { label, ph = '' } = {}) {
  return `<div class="campo">${label ? `<label for="${idCampo(f)}">${label}</label>` : ''}<input id="${idCampo(f)}" data-f="${f}" data-tipo="num" inputmode="decimal" value="${esc(numAInput(valor))}" placeholder="${esc(ph)}" aria-label="${esc(label || ph)}"></div>`;
}
function cSelect(f, valor, opciones, { label, vacio } = {}) {
  const ops = (vacio != null ? [['', vacio]] : []).concat(opciones.map(o => Array.isArray(o) ? o : [o, o]));
  return `<div class="campo">${label ? `<label for="${idCampo(f)}">${label}</label>` : ''}<select id="${idCampo(f)}" data-f="${f}" aria-label="${esc(label || f)}">${ops.map(([v, t]) => `<option value="${esc(v)}" ${v === valor ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
}
function cSeg(f, valor, opciones, { label } = {}) {
  return `<div class="campo">${label ? `<span class="lbl">${label}</span>` : ''}<div class="chips" role="group">${opciones.map(([v, t]) =>
    `<button type="button" class="chip" data-acc="seg" data-f="${f}" data-v="${esc(v)}" aria-pressed="${v === valor}">${esc(t)}</button>`).join('')}</div></div>`;
}
function leerValor(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.dataset.tipo === 'num') return parseNum(el.value);
  return el.value;
}

// ---------- 9.1 Inicio: buscador, filtros y lista ----------
function htmlAvisoRespaldo() {
  if (!S.recetas.length) return '';
  const ult = S.meta.ultimoRespaldo, dias = diasDesde(ult);
  const limite = S.meta.diasAviso ?? DIAS_AVISO_RESPALDO;
  const sinRespaldar = S.recetas.filter(r => !ult || r.modificada > ult).length;
  if (!sinRespaldar || (ult && dias < limite)) return '';
  return `<div class="aviso">${ic('alerta')} ${ult
      ? `Hace ${plural(dias, 'día', 'días')} que no respaldás. ${plural(sinRespaldar, 'receta cambió', 'recetas cambiaron')} desde entonces.`
      : `Todavía no hiciste ningún respaldo (${plural(sinRespaldar, 'receta', 'recetas')} sin respaldar).`}
    <button class="btn" data-acc="respaldar">${ic('nube')} Respaldar ahora</button></div>`;
}
function filtrarRecetas() {
  const f = S.filtros, q = norm(f.q);
  return S.recetas.filter(r =>
    (!f.sector || r.sectorId === f.sector) &&
    (!f.categoria || r.categoria === f.categoria) &&
    (!f.estado || (f.estado === 'vieja' ? r.versionVieja : r.estado === f.estado)) &&
    (!q || norm(r.nombre).includes(q) || r.ingredientes.some(i => norm(i.nombre).includes(q)) || norm(r.fuente.operario).includes(q))
  ).sort((a, b) => (a.versionVieja - b.versionVieja) || (a.nombre || '~').localeCompare(b.nombre || '~', 'es'));
}
// Atajo para retomar la última receta en borrador (si la tocaste en las últimas 12 h).
function htmlContinuar() {
  const r = S.recetas.filter(x => x.estado === 'borrador' && !x.versionVieja).sort((a, b) => b.modificada.localeCompare(a.modificada))[0];
  if (!r || Date.now() - new Date(r.modificada) > 12 * 3600000) return '';
  return `<a class="continuar" href="#/editar/${r.id}"><div><small>Seguir cargando</small><b>${esc(r.nombre || '(sin nombre)')}</b></div>${ic('siguiente')}</a>`;
}
function htmlItemReceta(r) {
  const rend = r.rendimiento.cantidad ? `${fmtNum(r.rendimiento.cantidad)} ${r.rendimiento.unidad}` : '';
  const meta = [r.categoria, rend, plural(r.ingredientes.length, 'ingrediente', 'ingredientes'), plural(r.pasos.length, 'paso', 'pasos')].filter(Boolean).join(' · ');
  return `<a class="item e-${r.estado} ${r.versionVieja ? 'vieja' : ''}" href="#/receta/${r.id}">
    <div class="item-nombre">${esc(r.nombre || '(sin nombre)')}</div>
    <div class="item-meta">${esc(meta)}</div>
    <div class="badges"><span class="badge ${r.estado}">${ESTADOS[r.estado]}</span>${r.versionVieja ? '<span class="badge vieja">Versión vieja</span>' : ''}</div></a>`;
}
function renderListaInicio() {
  const lista = filtrarRecetas();
  const borr = S.recetas.filter(r => r.estado === 'borrador' && !r.versionVieja).length;
  let html = `<p class="resumen">${plural(lista.length, 'receta', 'recetas')}${borr ? ` · <button class="link" data-acc="verBorradores">${plural(borr, 'en borrador', 'en borrador')}</button>` : ''}</p>`;
  if (!S.recetas.length) html += `<div class="vacio"><img class="logo-vacio" src="icons/logo-rojo.png" alt=""><p>Todavía no hay recetas.<br>Tocá <b>Nueva receta</b> para empezar a relevar.</p></div>`;
  else if (!lista.length) html += '<p class="vacio">No hay recetas con esos filtros.</p>';
  else if (S.filtros.sector) html += lista.map(htmlItemReceta).join('');
  else for (const s of [...S.sectores, { id: null }]) {
    const del = lista.filter(r => s.id ? r.sectorId === s.id : !getSector(r.sectorId));
    if (del.length) html += `<h2 class="grupo">${esc(s.id ? s.nombre : 'Sin sector')}</h2>` + del.map(htmlItemReceta).join('');
  }
  $('#listaRecetas').innerHTML = html;
}
function vistaInicio() {
  setHeader('Recetario Manolo', false);
  const f = S.filtros;
  app.innerHTML = `${htmlAvisoRespaldo()}${htmlContinuar()}
    <div class="con-voz"><input id="buscar" type="search" placeholder="Buscar receta, ingrediente u operario…" value="${esc(f.q)}" aria-label="Buscar">${MIC}</div>
    <div class="chips desliza">${[['', 'Todos'], ...S.sectores.map(s => [s.id, s.nombre])].map(([v, t]) =>

    <div class="fila">

      <select id="fEstado" aria-label="Filtrar por estado"><option value="">Todos los estados</option>${Object.entries(ESTADOS).map(([v, t]) => `<option value="${v}" ${f.estado === v ? 'selected' : ''}>${t}</option>`).join('')}<option value="vieja" ${f.estado === 'vieja' ? 'selected' : ''}>Versiones viejas</option></select>
    </div>

  renderListaInicio();
  setAcciones(`<button class="btn" data-acc="nuevaReceta">${ic('mas')} Nueva receta</button><button class="btn sec cuadrado" data-acc="respaldar" aria-label="Respaldar">${ic('nube')}</button>`);
  app.oninput = e => {

  accionesVista = {

  };

function vistaSectores() {
  setHeader('Sectores');
  app.innerHTML = S.sectores.map((s, i) => {
    const n = S.recetas.filter(r => r.sectorId === s.id).length;
    return `<div class="tarjeta"><div class="fila" style="align-items:center">
      <div><b>${esc(s.nombre)}</b><div class="peq">${plural(n, 'receta', 'recetas')}</div></div>
      <div class="ord">${btnIc('moverSector', 'arriba', 'Subir', `data-i="${i}" data-d="-1"`)}${btnIc('moverSector', 'abajo', 'Bajar', `data-i="${i}" data-d="1"`)}</div></div>
      <div class="fila" style="margin-top:8px"><button class="btn sec chico" data-acc="renombrarSector" data-id="${s.id}">${ic('editar')} Renombrar</button>
      <button class="btn sec chico" data-acc="borrarSector" data-id="${s.id}" style="color:var(--danger)">${ic('basura')} Borrar</button></div></div>`;
  }).join('') || '<p class="vacio">No hay sectores.</p>';
  setAcciones(`<button class="btn" data-acc="nuevoSector">${ic('mas')} Nuevo sector</button>`);
  accionesVista = {
    async nuevoSector() {
      const n = await pedirTexto('Nuevo sector', '', 'Ej.: Churrería');
      if (!n) return;
      await guardarSector({ id: uid(), nombre: n, orden: S.sectores.length });
      vistaSectores();
    },
    async renombrarSector(b) {
      const s = getSector(b.dataset.id);
      const n = await pedirTexto('Renombrar sector', s.nombre);
      if (!n) return;
      s.nombre = n; await guardarSector(s); vistaSectores();
    },
    async borrarSector(b) {
      const s = getSector(b.dataset.id);
      const n = S.recetas.filter(r => r.sectorId === s.id).length;
      if (n) { await modal({ titulo: 'No se puede borrar', cuerpo: `<p>"${esc(s.nombre)}" tiene ${plural(n, 'receta', 'recetas')}. Pasalas a otro sector o borralas primero.</p>` }); return; }
      if (!await confirmar(`¿Borrar el sector "${s.nombre}"?`, { si: 'Sí, borrar', peligro: true })) return;
      await DB.del('sectores', s.id);
      S.sectores = S.sectores.filter(x => x !== s);
      if (S.filtros.sector === s.id) S.filtros.sector = '';
      vistaSectores();
    },
    async moverSector(b) {
      if (!mover(S.sectores, +b.dataset.i, +b.dataset.d)) return;
      S.sectores.forEach((s, i) => s.orden = i);
      await DB.putVarios('sectores', S.sectores);
      vistaSectores();
    },
  };
}

function vistaEditar(id) {
  const r = getReceta(id);
  if (!r) return noEncontrada();
  recetaEditando = r.id;

  const abiertos = new Set();   // ingredientes con "⋯" desplegado

  app.innerHTML = `
  <datalist id="dlIngredientes">${nombresIng.map(n => `<option value="${esc(n)}">`).join('')}</datalist>

  <details class="sec" open><summary>Datos generales</summary>

    <div class="fila">${cSelect('sectorId', r.sectorId, S.sectores.map(s => [s.id, s.nombre]), { label: 'Sector' })}
    ${cSelect('categoria', r.categoria, CATEGORIAS, { label: 'Categoría', vacio: '— Elegir —' })}</div>
    ${cSeg('estado', r.estado, Object.entries(ESTADOS), { label: 'Estado' })}
    ${cTexto('fuente.operario', r.fuente.operario, { label: 'Operario que la cuenta', ph: 'Nombre' })}
    ${cSeg('fuente.tipo', r.fuente.tipo, [['observado', 'Lo observé yo'], ['declarado', 'Me lo contó']], { label: 'Origen de la información' })}
    <div class="campo"><label for="f-fuente-fecha">Fecha del relevamiento</label><input type="date" id="f-fuente-fecha" data-f="fuente.fecha" value="${esc(r.fuente.fecha)}"></div>
    <label class="check"><input type="checkbox" data-f="versionVieja" ${r.versionVieja ? 'checked' : ''}> Es una versión vieja</label>
  </details>
  <details class="sec" open><summary>Rendimiento</summary>
    <div class="fila">${cNum('rendimiento.cantidad', r.rendimiento.cantidad, { label: 'Cantidad', ph: 'Ej.: 12' })}
    ${cTexto('rendimiento.unidad', r.rendimiento.unidad, { label: 'Unidad', ph: 'kg, unidades…', voz: false, lista: 'dlRend' })}</div>
    ${cNum('rendimiento.pesoUnidad', r.rendimiento.pesoUnidad, { label: 'Peso por unidad (g), si aplica', ph: 'Ej.: 60' })}
  </details>
  <details class="sec" open><summary>Ingredientes <span class="cuenta" id="cuentaIng"></span></summary>
    <div id="avisoSubs"></div>
    <div class="dictado"><label class="lbl" for="cargaRapida">Dictá o pegá varios ingredientes juntos</label>
      <div class="con-voz"><textarea id="cargaRapida" data-lineas="1" placeholder="500 g harina 000, 200 g manteca, 3 huevos"></textarea>${MIC}</div>
      <button class="btn ancho" data-acc="cargaRapida">${ic('siguiente')} Agregar a la lista</button></div>
    <div id="listaIng"></div>
    <button class="btn sec ancho" data-acc="ingAgregar">${ic('mas')} Agregar uno a mano</button>
  </details>
  <details class="sec" open><summary>Pasos <span class="cuenta" id="cuentaPasos"></span></summary>
    <div id="listaPasos"></div>
    <div class="dictado"><label class="lbl" for="nuevoPaso">Dictá o escribí el paso siguiente</label>
      <div class="con-voz"><textarea id="nuevoPaso" placeholder="Ej.: Batir la manteca con el azúcar hasta blanquear"></textarea>${MIC}</div>
      <button class="btn ancho" data-acc="pasoSiguiente">${ic('siguiente')} Siguiente paso</button></div>
  </details>
  <details class="sec" open><summary>Fotos <span class="cuenta" id="cuentaFotos"></span></summary>
    <div class="fotos" id="fotosReceta"></div>
    <div class="fila"><button class="btn sec" data-acc="fotoAgregar" data-cam="1">${ic('camara')} Sacar foto</button><button class="btn sec" data-acc="fotoAgregar">${ic('imagen')} Galería</button></div>
    <p class="peq">La primera foto es la del producto terminado (sale en la ficha).</p>
  </details>
  <details class="sec"><summary>Cocción / producción</summary>
    ${cTexto('coccion.horno', r.coccion.horno, { label: 'Horno / freidora / equipo', ph: 'Ej.: horno rotativo' })}
    <div class="fila">${cTexto('coccion.temp', r.coccion.temp, { label: 'Temperatura', ph: '180 °C', voz: false })}
    ${cTexto('coccion.tiempo', r.coccion.tiempo, { label: 'Tiempo', ph: '25 min', voz: false })}</div>
    <div class="fila">${cTexto('coccion.bandejasTanda', r.coccion.bandejasTanda, { label: 'Bandejas por tanda', ph: '8', voz: false })}
    ${cTexto('coccion.reposo', r.coccion.reposo, { label: 'Reposo / fermentación', ph: '40 min a 30 °C', voz: false })}</div>
  </details>
  <details class="sec"><summary>Equipos y utensilios</summary>
    ${cTexto('equipos', r.equipos, { label: 'Equipos', area: true, ph: 'Amasadora, batidora planetaria, horno rotativo…' })}
    ${cTexto('utensilios', r.utensilios, { label: 'Utensilios', area: true, ph: 'Manga, pico rizado, bowl…' })}
  </details>
  <details class="sec"><summary>Alérgenos <span class="cuenta" id="cuentaAlerg">${r.alergenos.length || ''}</span></summary>
    <div class="chips">${ALERGENOS.map(a => `<button type="button" class="chip" data-acc="alergeno" data-v="${a}" aria-pressed="${r.alergenos.includes(a)}">${a}</button>`).join('')}</div>
  </details>
  <details class="sec"><summary>Conservación</summary>
    ${cSeg('conservacion.donde', r.conservacion.donde, LUGARES_CONSERVACION.map(l => [l, l]), { label: 'Dónde' })}
    <div class="fila">${cTexto('conservacion.temp', r.conservacion.temp, { label: 'Temperatura', ph: '4 °C', voz: false })}
    ${cTexto('conservacion.vidaUtil', r.conservacion.vidaUtil, { label: 'Vida útil', ph: '3 días', voz: false })}</div>
  </details>
  <details class="sec"><summary>Puntos críticos y variaciones</summary>
    ${cTexto('puntosCriticos', r.puntosCriticos, { label: 'Puntos críticos / trucos del operario', area: true, ph: 'Ej.: si la masa queda chirle, agregar harina de a poco' })}
    ${cTexto('variaciones', r.variaciones, { label: 'Variaciones entre operarios', area: true, ph: 'Ej.: Carlos le pone media taza más de agua' })}
  </details>
  <button class="btn sec ancho" data-acc="borrarEsta" style="color:var(--danger);margin-top:24px">${ic('basura')} Borrar receta</button>`;

  const guardar = () => Autoguardado.programar(r);
  const renderIng = () => {
    $('#listaIng').innerHTML = r.ingredientes.map((ing, i) => htmlIngrediente(ing, i, r, abiertos.has(ing.id))).join('');
    $('#cuentaIng').textContent = r.ingredientes.length || '';
    $('#avisoSubs').innerHTML = htmlAvisoSubs(r);
  };
  const renderPasos = () => { $('#listaPasos').innerHTML = r.pasos.map(htmlPaso).join(''); $('#cuentaPasos').textContent = r.pasos.length || ''; hidratarFotos($('#listaPasos')); };
  const renderFotos = () => {
    $('#fotosReceta').innerHTML = r.fotoIds.map((f, i) => `<div class="foto"><img data-foto="${f}" alt="Foto ${i + 1}"><button data-acc="fotoBorrar" data-id="${f}" aria-label="Borrar foto">${ic('x')}</button></div>`).join('');
    $('#cuentaFotos').textContent = r.fotoIds.length || '';
    hidratarFotos($('#fotosReceta'));
  };
  renderIng(); renderPasos(); renderFotos();
  // Barra de abajo: estado del guardado, cámara siempre a mano y "Ver receta".
  setAcciones(`<span id="estadoGuardado">✓ Guardado</span><button class="btn sec cuadrado" data-acc="fotoAgregar" data-cam="1" aria-label="Sacar foto">${ic('camara')}</button><a class="btn" href="#/receta/${r.id}">${ic('ojo')} Ver receta</a>`);

  // Cualquier cambio en un campo con data-f se vuelca a la receta y se autoguarda.
  app.oninput = app.onchange = e => {
    const el = e.target.closest('[data-f]');
    if (!el) return;
    setPath(r, el.dataset.f, leerValor(el));
    if (el.dataset.f === 'nombre') setHeader(r.nombre || 'Receta nueva');
    // Casos especiales de ingredientes: sub-recetas y filas de texto libre.
    const m = el.dataset.f.match(/^ingredientes\.(\d+)\.(esSubReceta|subRecetaId|cantidad|unidad)$/);
    if (m && e.type === 'change' || m && el.type !== 'checkbox' && el.tagName !== 'SELECT') {
      const ing = r.ingredientes[+m[1]];
      if (m[2] === 'cantidad' || m[2] === 'unidad') ing.textoLibre = false;
      if (m[2] === 'subRecetaId') { ing.subRecetaId = ing.subRecetaId || null; const sr = getReceta(ing.subRecetaId); if (sr) ing.nombre = sr.nombre; }
      if (m[2] === 'esSubReceta' && ing.esSubReceta && !ing.subRecetaId) {
        const sr = S.recetas.find(x => x.id !== r.id && norm(x.nombre) && norm(x.nombre) === norm(ing.nombre));
        if (sr) ing.subRecetaId = sr.id;
      }
      if (m[2] === 'esSubReceta' || m[2] === 'subRecetaId') renderIng();
    }
    guardar();
  };
  // Agrega un ítem a una lista con opción de deshacer al borrar.
  const borrarDeLista = (lista, i, render, txt) => {
    const [quitado] = lista.splice(i, 1); render(); guardar();
    toast(txt + ' borrado', { accion: 'Deshacer', fn: () => { lista.splice(i, 0, quitado); render(); guardar(); } });
  };
  accionesVista = {
    seg(b) { setPath(r, b.dataset.f, b.dataset.v); $$('.chip', b.parentElement).forEach(c => c.setAttribute('aria-pressed', c === b)); guardar(); },
    alergeno(b) {
      const a = b.dataset.v, i = r.alergenos.indexOf(a);
      if (i < 0) r.alergenos.push(a); else r.alergenos.splice(i, 1);
      b.setAttribute('aria-pressed', i < 0); $('#cuentaAlerg').textContent = r.alergenos.length || ''; guardar();
    },
    ingAgregar() { r.ingredientes.push(ingredienteVacio()); renderIng(); guardar(); $$('#listaIng .ing').pop().querySelector('input').focus(); },
    ingMover(b) { if (mover(r.ingredientes, +b.dataset.i, +b.dataset.d)) { renderIng(); guardar(); } },
    ingBorrar(b) { borrarDeLista(r.ingredientes, +b.dataset.i, renderIng, 'Ingrediente'); },
    ingMas(b) { const k = b.dataset.id; if (abiertos.has(k)) abiertos.delete(k); else abiertos.add(k); renderIng(); },
    cargaRapida() {
      const ta = $('#cargaRapida');
      const nuevos = partirLineas(ta.value).map(interpretarLinea);
      if (!nuevos.length) { toast('Dictá o pegá ingredientes primero.'); return; }
      r.ingredientes.push(...nuevos); ta.value = ''; renderIng(); guardar();
      const dudosos = nuevos.filter(i => i.textoLibre).length;
      toast(`${plural(nuevos.length, 'ingrediente agregado', 'ingredientes agregados')}${dudosos ? ` (${dudosos} para revisar)` : ''}`);
    },
    crearSub: b => crearSubReceta(r, +b.dataset.i),
    pasoSiguiente() {
      const ta = $('#nuevoPaso'), t = ta.value.trim();
      if (!t) { toast('Dictá o escribí el paso primero.'); return; }
      r.pasos.push({ ...pasoVacio(), texto: capitalizar(t) });
      ta.value = ''; renderPasos(); guardar();
      toast(`Paso ${r.pasos.length} agregado`);
    },
    pasoMover(b) { if (mover(r.pasos, +b.dataset.i, +b.dataset.d)) { renderPasos(); guardar(); } },
    pasoBorrar(b) { borrarDeLista(r.pasos, +b.dataset.i, renderPasos, 'Paso'); },
    async pasoFoto(b) {
      const [f] = await elegirFotos(!!b.dataset.cam); if (!f) return;
      try { r.pasos[+b.dataset.i].fotoId = await guardarFoto(r.id, f); renderPasos(); guardar(); }
      catch (e) { toast('No se pudo guardar la foto: ' + e.message); }
    },
    async pasoQuitarFoto(b) {
      const p = r.pasos[+b.dataset.i];
      if (!await confirmar('¿Quitar la foto de este paso?', { si: 'Quitar', peligro: true })) return;
      const fid = p.fotoId; p.fotoId = null; renderPasos(); await Autoguardado.programar(r); await borrarFoto(fid);
    },
    async fotoAgregar(b) {
      const files = await elegirFotos(!!b.dataset.cam);
      for (const f of files) {
        try { r.fotoIds.push(await guardarFoto(r.id, f)); } catch (e) { toast('No se pudo guardar la foto: ' + e.message); }
      }
      renderFotos(); guardar();
    },
    async fotoBorrar(b) {
      if (!await confirmar('¿Borrar esta foto?', { si: 'Borrar', peligro: true })) return;
      r.fotoIds = r.fotoIds.filter(x => x !== b.dataset.id); renderFotos(); guardar(); await borrarFoto(b.dataset.id);
    },
    async borrarEsta() {
      if (!await confirmar(`Se borra "${r.nombre || 'esta receta'}" con sus fotos. No se puede deshacer (salvo desde un respaldo).`, { si: 'Sí, borrar receta', peligro: true })) return;
      Autoguardado.pendiente = null; recetaEditando = null;
      await borrarReceta(r); toast('Receta borrada'); location.replace('#/');
    },
  };
}

// ---------- 9.5 Vista de lectura de una receta ----------
// Devuelve [etiqueta, valor] solo si hay valor (los campos vacíos se omiten).
const par = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : '';
function textoRendimiento(r) {
  const x = r.rendimiento;
  if (!x.cantidad) return '';
  return `${fmtNum(x.cantidad)} ${x.unidad}` + (x.pesoUnidad ? ` (${fmtNum(x.pesoUnidad)} g por unidad)` : '');
}
// Lista de ingredientes (escalada por "factor"), con las sub-recetas desplegables.
function htmlLineasIng(lineas, factor) {
  return `<ul class="ings">${lineas.map(l => `<li><span class="cant">${esc(textoCantidad(l.cant, l.unidad))}</span> ${esc(l.ing.nombre)}`
    + (l.ing.esSubReceta ? ' <span class="badge a_validar">sub-receta</span>' : '')
    + (l.ing.nota ? ` <span class="peq">— ${esc(l.ing.nota)}</span>` : '')
    + (factor !== 1 && NO_ESCALAN.includes(l.ing.unidad) ? ' <span class="peq">(no se escala)</span>' : '')
    + (l.subError ? `<div class="peq">⚠ ${esc(l.subError)}</div>` : '')
    + (l.sub ? `<details class="sub"><summary>Ver ${esc(l.sub.receta.nombre)} para esta cantidad (×${fmtNum(l.sub.factor)})</summary>${htmlLineasIng(l.sub.lineas, l.sub.factor)}</details>` : '')
    + '</li>').join('')}</ul>`;
}
function htmlIngredientesLectura(r, factor = 1) {
  if (!r.ingredientes.length) return '<p class="peq">Sin ingredientes cargados.</p>';
  return htmlLineasIng(escalarIngredientes(r, factor), factor);
}
// Aviso de sub-recetas que todavía no existen, con atajo para crearlas.
const subRecetasFaltantes = r => r.ingredientes.map((ing, i) => ({ ing, i })).filter(({ ing }) => ing.esSubReceta && !(ing.subRecetaId && getReceta(ing.subRecetaId)));
function htmlAvisoSubs(r) {
  const f = subRecetasFaltantes(r);
  if (!f.length) return '';
  return `<div class="aviso">${ic('alerta')} ${f.length === 1 ? 'Usa una sub-receta que todavía no existe:' : 'Usa sub-recetas que todavía no existen:'}
    ${f.map(({ ing, i }) => `<button class="btn" data-acc="crearSub" data-i="${i}">${ic('mas')} Crear «${esc(ing.nombre || 'sin nombre')}»</button>`).join('')}</div>`;
}
async function crearSubReceta(r, i) {
  await Autoguardado.flush();
  const ing = r.ingredientes[i];
  const n = recetaVacia(r.sectorId);
  n.nombre = ing.nombre;
  await guardarReceta(n);
  ing.subRecetaId = n.id;
  await guardarReceta(r);
  toast('Sub-receta creada. Completala y volvé con ←');
  location.hash = '#/editar/' + n.id;
}
// Bloque de escalado en la vista de la receta.
function htmlEscala(r) {
  const f = S.escala[r.id] || 1, rc = r.rendimiento.cantidad;
  return `<details class="sec" ${f !== 1 ? 'open' : ''}><summary>Escalar cantidades ${f !== 1 ? `<span class="cuenta">×${fmtNum(f)}</span>` : ''}</summary>
    ${rc
      ? `<div class="fila" style="align-items:center"><label for="escObjetivo" style="flex:0 0 auto">Quiero hacer</label><input id="escObjetivo" inputmode="decimal" value="${esc(numAInput(+(rc * f).toFixed(3)))}"><span style="flex:0 0 auto">${esc(r.rendimiento.unidad)}</span></div>`
      : `<div class="fila" style="align-items:center"><label for="escFactor" style="flex:0 0 auto">Multiplicar por</label><input id="escFactor" inputmode="decimal" value="${esc(numAInput(f))}"></div><p class="peq">Cargá el rendimiento para poder escalar por cantidad.</p>`}
    <div class="chips">${[0.5, 1, 2, 3].map(x => `<button class="chip" data-acc="escChip" data-v="${x}" aria-pressed="${f === x}">×${fmtNum(x)}</button>`).join('')}</div>
    <p id="escInfo" class="peq">${esc(infoEscala(r, f))}</p></details>`;
}
function infoEscala(r, f) {
  if (f === 1) return '';
  const x = r.rendimiento;
  let t = `Factor ×${fmtNum(f)}`;
  if (x.cantidad) {
    t += ` · rinde ${fmtNum(x.cantidad * f)} ${x.unidad}`;
    const b = aBase(x.cantidad * f, unidadRendimiento(x.unidad));
    if (x.pesoUnidad && b.fam === 'masa') t += ` ≈ ${fmtNum(b.v / x.pesoUnidad)} unidades de ${fmtNum(x.pesoUnidad)} g`;
  }
  return t;
}
function detallePaso(p) {
  return [p.tiempoMin ? `${fmtNum(p.tiempoMin)} min` : '', p.temp, p.equipo].filter(Boolean).join(' · ');
}
function vistaReceta(id) {
  const r = getReceta(id);
  if (!r) return noEncontrada();
  setHeader(r.nombre || '(sin nombre)');
  const c = r.coccion, k = r.conservacion;
  const coccion = par('Equipo', c.horno) + par('Temperatura', c.temp) + par('Tiempo', c.tiempo) + par('Bandejas por tanda', c.bandejasTanda) + par('Reposo / fermentación', c.reposo);
  const conserv = par('Dónde', k.donde) + par('Temperatura', k.temp) + par('Vida útil', k.vidaUtil);
  app.innerHTML = `<div class="lectura">
    ${r.fotoIds[0] ? `<img class="foto-portada" data-foto="${r.fotoIds[0]}" alt="Producto terminado">` : ''}
    <div class="badges" style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge ${r.estado}">${ESTADOS[r.estado]}</span>${r.versionVieja ? '<span class="badge vieja">Versión vieja</span>' : ''}</div>
    <dl>${par('Sector', nombreSector(r.sectorId))}${par('Categoría', r.categoria)}${par('Rendimiento', textoRendimiento(r))}</dl>
    <div id="zonaEscala">${htmlEscala(r)}</div>
    <div>${htmlAvisoSubs(r)}</div>
    <h2>Ingredientes</h2><div id="zonaIngredientes">${htmlIngredientesLectura(r, S.escala[r.id] || 1)}</div>
    <h2>Pasos</h2>${r.pasos.length ? `<ol class="pasos">${r.pasos.map(p => `<li><div class="texto-libre">${esc(p.texto)}</div>${detallePaso(p) ? `<div class="det-paso">${esc(detallePaso(p))}</div>` : ''}${p.fotoId ? `<div class="foto-paso"><img data-foto="${p.fotoId}" alt=""></div>` : ''}</li>`).join('')}</ol>` : '<p class="peq">Sin pasos cargados.</p>'}
    ${r.equipos || r.utensilios ? `<h2>Equipos y utensilios</h2><dl>${par('Equipos', r.equipos)}${par('Utensilios', r.utensilios)}</dl>` : ''}
    ${coccion ? `<h2>Cocción / producción</h2><dl>${coccion}</dl>` : ''}
    ${r.alergenos.length ? `<h2>Alérgenos</h2><p><b>${esc(r.alergenos.join(', '))}</b></p>` : ''}
    ${conserv ? `<h2>Conservación</h2><dl>${conserv}</dl>` : ''}
    ${r.puntosCriticos ? `<h2>Puntos críticos / trucos</h2><p class="texto-libre">${esc(r.puntosCriticos)}</p>` : ''}
    ${r.variaciones ? `<h2>Variaciones</h2><p class="texto-libre">${esc(r.variaciones)}</p>` : ''}
    <h2>Fuente</h2><dl>${par('Operario', r.fuente.operario)}${par('Fecha', fmtFecha(r.fuente.fecha))}${par('Origen', r.fuente.tipo === 'observado' ? 'Observado durante el relevamiento' : 'Declarado por el operario')}</dl>
    ${r.fotoIds.length > 1 ? `<h2>Fotos</h2><div class="fotos">${r.fotoIds.slice(1).map(f => `<div class="foto"><img data-foto="${f}" alt=""></div>`).join('')}</div>` : ''}
    <p class="peq">Última modificación: ${new Date(r.modificada).toLocaleString('es-AR')}</p>
  </div>`;
  hidratarFotos(app);
  setAcciones(`<a class="btn sec" href="#/editar/${r.id}">${ic('editar')} Editar</a><a class="btn" href="#/cocina/${r.id}">${ic('cocina')} Cocina</a><button class="btn sec cuadrado" data-acc="masOpciones" aria-label="Más opciones">${ic('puntos')}</button>`);
  // Escalado: al cambiar el objetivo o el factor se recalculan los ingredientes.
  const aplicarEscala = (f, redibujarBloque) => {
    if (!(f > 0)) return;
    S.escala[r.id] = f;
    $('#zonaIngredientes').innerHTML = htmlIngredientesLectura(r, f);
    if (redibujarBloque) $('#zonaEscala').innerHTML = htmlEscala(r);
    else { $('#escInfo').textContent = infoEscala(r, f); $$('[data-acc=escChip]').forEach(c => c.setAttribute('aria-pressed', +c.dataset.v === f)); }
  };
  app.oninput = e => {
    if (e.target.id === 'escObjetivo') aplicarEscala(parseNum(e.target.value) / r.rendimiento.cantidad);
    if (e.target.id === 'escFactor') aplicarEscala(parseNum(e.target.value));
  };
  accionesVista = {
    escChip: b => aplicarEscala(+b.dataset.v, true),
    crearSub: b => crearSubReceta(r, +b.dataset.i),
    async masOpciones() {
      const v = await modal({
        titulo: r.nombre || 'Receta', botones: [

// Duplica una receta (con copias de sus fotos) y la deja en borrador.
async function duplicarReceta(r) {

  Object.assign(n, { id: uid(), nombre: (r.nombre || 'Receta') + ' (copia)', estado: 'borrador', versionVieja: false, creada: new Date().toISOString() });
  n.ingredientes.forEach(i => i.id = uid());

/* =====================================================================
   10. CARGA RÁPIDA: interpretar líneas como "500 g harina 000"
   Si una línea no se entiende, queda como ingrediente de texto libre.
   ===================================================================== */
const ALIAS_UNIDAD = {};
[['g', 'g gr grs gramo gramos'], ['kg', 'kg kgs kilo kilos kilogramo kilogramos'], ['mL', 'ml cc cm3 mililitro mililitros'],
 ['L', 'l lt lts litro litros'], ['unidad', 'u un unid unidad unidades'], ['cucharada', 'cda cdas cucharada cucharadas'],
 ['cucharadita', 'cdita cditas cucharadita cucharaditas'], ['taza', 'taza tazas'], ['pizca', 'pizca pizcas']]
  .forEach(([u, alias]) => alias.split(' ').forEach(a => ALIAS_UNIDAD[a] = u));
const NUM_PALABRA = { un: 1, una: 1, uno: 1, medio: .5, media: .5, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, doce: 12 };
// Orden importante: primero "1 1/2" y "1/2", después "1,5" / "1.500" / "3".
const RE_NUM = '(\\d+ \\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?|[½¼¾⅓⅔])';
const VAGOS = ['poco', 'poquito', 'chorrito', 'chorro', 'punado', 'toque', 'cachito'];   // "un poco de…" → texto libre
const unidadDe = palabra => ALIAS_UNIDAD[norm(palabra).replace(/\.$/, '')] || null;

// Separa por renglones, ";", comas seguidas de espacio (no "1,5") e " y " antes de un número.
const partirLineas = texto => texto.split(/\n|;|,(?=\s)|\s+y\s+(?=\d)/).map(s => s.replace(/^[\s\-•*·]+/, '').trim()).filter(Boolean);

function interpretarLinea(linea) {
  const ing = { ...ingredienteVacio(), unidad: '' };
  let txt = linea.trim(), m;
  // Nota entre paréntesis o después de " - "
  if ((m = txt.match(/\(([^)]*)\)/))) { ing.nota = m[1].trim(); txt = txt.replace(m[0], ' ').replace(/\s+/g, ' ').trim(); }
  if ((m = txt.match(/\s[-–—]\s(.+)$/))) { ing.nota = [ing.nota, m[1].trim()].filter(Boolean).join('; '); txt = txt.slice(0, m.index).trim(); }

  if (/\ba gusto\b/i.test(txt)) {
    ing.unidad = 'a gusto';
    ing.nombre = txt.replace(/\ba gusto\b/i, '').replace(/^(de|del)\s+/i, '').trim();
  } else {
    let cant = null, resto = txt, enPalabras = false, vago = false;
    const palabras = txt.split(/\s+/);
    if ((m = txt.match(new RegExp('^' + RE_NUM + '\\s*(.*)$')))) { cant = parseNum(m[1]); resto = m[2]; }
    else if (VAGOS.includes(norm(palabras[1]))) vago = true;      // "un poco de agua": no hay cantidad
    else if (norm(palabras[0]) === 'un' && norm(palabras[1]) === 'cuarto') { cant = .25; resto = palabras.slice(2).join(' '); enPalabras = true; }
    else if (NUM_PALABRA[norm(palabras[0])] != null) { cant = NUM_PALABRA[norm(palabras[0])]; resto = palabras.slice(1).join(' '); enPalabras = true; }
    const [p1, ...demas] = resto.split(/\s+/);
    const u = p1 && !vago ? unidadDe(p1) : null;
    if (u) resto = demas.join(' ');
    resto = resto.replace(/^(de|del)\s+/i, '').trim();
    if (cant != null) {
      ing.cantidad = cant; ing.unidad = u || 'unidad'; ing.nombre = resto;
      if (enPalabras && !u) ing.textoLibre = true;      // "dos huevos": probable, pero mejor revisarlo
    }
    else if (u) { ing.unidad = u; ing.nombre = resto; }                   // "pizca de sal"
    else if ((m = txt.match(new RegExp('^(.+?)\\s+' + RE_NUM + '\\s*([a-zA-Z.]+)$'))) && unidadDe(m[3])) {
      ing.nombre = m[1]; ing.cantidad = parseNum(m[2]); ing.unidad = unidadDe(m[3]);   // "harina 000 500 g"
    } else { ing.nombre = txt; ing.textoLibre = true; }
  }
  if (!ing.nombre) { Object.assign(ing, { nombre: linea.trim(), cantidad: null, unidad: '', textoLibre: true }); }
  ing.nombre = capitalizar(ing.nombre);
  // Si el nombre coincide con otra receta, se vincula como sub-receta.
  const sub = S.recetas.find(r => norm(r.nombre) && norm(r.nombre) === norm(ing.nombre));
  if (sub) { ing.esSubReceta = true; ing.subRecetaId = sub.id; ing.nombre = sub.nombre; }
  return ing;
}

/* =====================================================================
   11. ESCALADO Y UNIDADES
   Todo se lleva a una unidad base (g o mL) para multiplicar y comparar,
   y después se presenta en kg o L si conviene.
   ===================================================================== */
const FACTOR_BASE = { g: ['masa', 1], kg: ['masa', 1000], mL: ['vol', 1], L: ['vol', 1000] };
function aBase(cant, unidad) { const f = FACTOR_BASE[unidad]; return f ? { fam: f[0], v: cant * f[1] } : { fam: unidad, v: cant }; }
function presentarCantidad(cant, unidad) {
  const f = FACTOR_BASE[unidad];
  if (cant == null || !f) return { cant, unidad };
  const v = cant * f[1];
  if (f[0] === 'masa') return v >= 1000 ? { cant: v / 1000, unidad: 'kg' } : { cant: v, unidad: 'g' };
  return v >= 1000 ? { cant: v / 1000, unidad: 'L' } : { cant: v, unidad: 'mL' };
}
const unidadRendimiento = u => unidadDe(u || '') || norm(u);
function textoCantidad(cant, unidad) {
  if (unidad === 'a gusto') return 'a gusto';
  if (cant == null) return unidad || '';
  if (unidad === 'unidad' || !unidad) return fmtNum(cant);
  const pl = cant > 1 && ['cucharada', 'cucharadita', 'taza', 'pizca'].includes(unidad) ? unidad + 's' : unidad;
  return `${fmtNum(cant)} ${pl}`;
}
// Devuelve las líneas de ingredientes multiplicadas por "factor".
// Si un ingrediente es sub-receta, calcula también sus ingredientes para esa cantidad.
function escalarIngredientes(r, factor, visitadas = new Set([r.id])) {
  return r.ingredientes.map(ing => {
    const fija = NO_ESCALAN.includes(ing.unidad) || ing.cantidad == null;
    const cant = fija ? ing.cantidad : ing.cantidad * factor;
    const p = fija ? { cant, unidad: ing.unidad } : presentarCantidad(cant, ing.unidad);
    const linea = { ing, cant: p.cant, unidad: p.unidad, fija };
    const sr = ing.esSubReceta && ing.subRecetaId && getReceta(ing.subRecetaId);
    if (sr) {
      if (visitadas.has(sr.id)) linea.subError = 'Referencia circular entre recetas';
      else if (!sr.rendimiento.cantidad || ing.cantidad == null) linea.subError = `Cargá el rendimiento de "${sr.nombre}" y la cantidad para calcular sus ingredientes`;
      else {
        const a = aBase(cant, ing.unidad), b = aBase(sr.rendimiento.cantidad, unidadRendimiento(sr.rendimiento.unidad));
        if (a.fam !== b.fam) linea.subError = `No puedo convertir ${ing.unidad || '(sin unidad)'} a ${sr.rendimiento.unidad} (rendimiento de la sub-receta)`;
        else {
          const f2 = a.v / b.v;
          linea.sub = { receta: sr, factor: f2, lineas: escalarIngredientes(sr, f2, new Set([...visitadas, sr.id])) };
        }
      }
    }
    return linea;
  });
}

/* =====================================================================
   12. MODO COCINA: pasos de a uno, pantalla encendida y temporizador
   ===================================================================== */
const Pantalla = {           // Wake Lock API (si el navegador la soporta)
  lock: null, activa: false,
  async pedir() {
    this.activa = true;
    try { if ('wakeLock' in navigator) { this.lock = await navigator.wakeLock.request('screen'); this.lock.onrelease = () => this.lock = null; } } catch (e) { this.lock = null; }
  },
  soltar() { this.activa = false; if (this.lock) this.lock.release().catch(() => { }); this.lock = null; },
};
// El bloqueo se pierde al minimizar: se vuelve a pedir al volver.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Pantalla.activa) Pantalla.pedir(); });

let audioCtx = null;
function desbloquearAudio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) { } }
function pitido() {
  navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]);
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  for (let i = 0; i < 3; i++) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001, t + i * .4); g.gain.exponentialRampToValueAtTime(.6, t + i * .4 + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * .4 + .3);
    o.start(t + i * .4); o.stop(t + i * .4 + .32);
  }
}
const mmss = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const Temporizador = {
  fin: null, id: null, alarmaId: null,
  iniciar(min, etiqueta) {
    desbloquearAudio();
    this.detener();
    this.fin = Date.now() + min * 60000;
    $('#timer .e').textContent = etiqueta;
    this.id = setInterval(() => this.tic(), 250); this.tic();
  },
  tic() {
    const el = $('#timer'), rest = this.fin - Date.now();
    el.classList.add('visible');
    if (rest > 0) { $('.t', el).textContent = mmss(rest); return; }
    clearInterval(this.id);
    el.classList.add('sonando'); $('.t', el).textContent = '¡Tiempo!';
    pitido();
    let veces = 0;
    this.alarmaId = setInterval(() => { if (++veces > 20) clearInterval(this.alarmaId); else pitido(); }, 3000);
  },
  detener() { clearInterval(this.id); clearInterval(this.alarmaId); this.fin = null; $('#timer').classList.remove('visible', 'sonando'); },
};

let cocina = null;   // { r, i } receta y página actual (0 = ingredientes)
async function vistaCocina(id) {
  const r = getReceta(id);

  accionesVista = {

}
function renderCocina() {

      ${p.fotoId ? `<img class="foto-portada" data-foto="${p.fotoId}" alt="">` : ''}

  }

  app.innerHTML = `<div class="lectura cocina"><div class="cocina-avance" aria-hidden="true"><span style="width:${n ? Math.round(i / n * 100) : 100}%"></span></div>${html}</div>`;

    <button class="btn" data-acc="cocinaSig" ${i === n ? 'disabled' : ''}>${i === 0 ? 'Empezar' : 'Siguiente'} ${ic('siguiente')}</button>`);
}
