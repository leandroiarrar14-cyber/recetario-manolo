// ---------- 13.2 Markdown (pensado para leer y para pasarle a un asistente de IA) ----------
// Omite los campos vacíos y marca si la info fue observada o declarada.
function mdReceta(r, nivel = 1) {
  const h = k => '#'.repeat(Math.min(6, nivel + k)) + ' ';
  const L = [h(0) + (r.nombre || '(sin nombre)'), ''];
  const dato = (k, v) => { if (v) L.push(`- **${k}:** ${v}`); };
  const fu = r.fuente;
  dato('Sector', nombreSector(r.sectorId));
  dato('Categoría', r.categoria);
  dato('Estado', ESTADOS[r.estado] + (r.versionVieja ? ' (versión vieja)' : ''));
  dato('Rendimiento', textoRendimiento(r));
  dato('Fuente', [fu.operario && `${fu.operario} (operario)`, fmtFecha(fu.fecha)].filter(Boolean).join(', '));
  dato('Origen de la información', fu.tipo === 'observado' ? 'OBSERVADO durante el relevamiento' : 'DECLARADO por el operario (no observado)');
  L.push('');
  if (r.ingredientes.length) {
    L.push(h(1) + 'Ingredientes', '');
    for (const i of r.ingredientes) {
      const cant = textoCantidad(i.cantidad, i.unidad === 'unidad' ? 'unidad' : i.unidad);
      const sub = i.esSubReceta ? ` [sub-receta${i.subRecetaId && getReceta(i.subRecetaId) ? '' : ', todavía no cargada'}]` : '';
      L.push(`- ${[cant, i.nombre].filter(Boolean).join(' — ')}${i.nota ? ` (${i.nota})` : ''}${sub}`);
    }
    L.push('');
  }
  if (r.pasos.length) {
    L.push(h(1) + 'Pasos', '');
    r.pasos.forEach((p, k) => {
      const det = [p.tiempoMin && `tiempo: ${fmtNum(p.tiempoMin)} min`, p.temp && `temperatura: ${p.temp}`, p.equipo && `equipo: ${p.equipo}`].filter(Boolean).join('; ');
      L.push(`${k + 1}. ${p.texto.replace(/\s*\n+\s*/g, ' ')}${det ? ` (${det})` : ''}`);
    });
    L.push('');
  }
  const seccion = (t, items) => {
    const it = items.filter(x => x[1] && String(x[1]).trim());
    if (!it.length) return;
    L.push(h(1) + t, '');
    it.forEach(([k, v]) => L.push(`- **${k}:** ${String(v).trim().replace(/\s*\n+\s*/g, ' / ')}`));
    L.push('');
  };
  const c = r.coccion, k = r.conservacion;
  seccion('Equipos y utensilios', [['Equipos', r.equipos], ['Utensilios', r.utensilios]]);
  seccion('Cocción / producción', [['Equipo', c.horno], ['Temperatura', c.temp], ['Tiempo', c.tiempo], ['Bandejas por tanda', c.bandejasTanda], ['Reposo / fermentación', c.reposo]]);
  if (r.alergenos.length) L.push(h(1) + 'Alérgenos', '', r.alergenos.join(', '), '');
  seccion('Conservación', [['Dónde', k.donde], ['Temperatura', k.temp], ['Vida útil', k.vidaUtil]]);
  const libre = (t, v) => { if (v && v.trim()) L.push(h(1) + t, '', v.trim(), ''); };
  libre('Puntos críticos / trucos (según el operario)', r.puntosCriticos);
  libre('Variaciones entre operarios', r.variaciones);
  const nf = idsFotosDeReceta(r).length;
  if (nf) L.push(`_${plural(nf, 'foto', 'fotos')} en el respaldo ZIP._`, '');
  return L.join('\n');
}

// Separador ";" y coma decimal: así abre bien en una planilla configurada en español.
function csvIngredientes() {
  const filas = [['Sector', 'Receta', 'Estado', 'Ingrediente', 'Cantidad', 'Unidad', 'Nota', 'Sub-receta', 'Rendimiento', 'Unidad rendimiento']];
  const orden = [...S.recetas].sort((a, b) => nombreSector(a.sectorId).localeCompare(nombreSector(b.sectorId), 'es') || (a.nombre || '').localeCompare(b.nombre || '', 'es'));

// ---------- 13.4 ZIP sin librerías (escritor "store", sin compresión, y lector) ----------
const TABLA_CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = TABLA_CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
// archivos: [{ nombre: 'carpeta/archivo.ext', datos: string | Blob | Uint8Array }]
async function crearZip(archivos) {
  const enc = new TextEncoder(), partes = [], central = [];
  const d = new Date();
  const hora = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const fecha = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const a of archivos) {
    const datos = typeof a.datos === 'string' ? enc.encode(a.datos) : a.datos instanceof Blob ? new Uint8Array(await a.datos.arrayBuffer()) : a.datos;
    const nombre = enc.encode(a.nombre), crc = crc32(datos);
    const lh = new DataView(new ArrayBuffer(30));          // encabezado local
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, hora, true); lh.setUint16(12, fecha, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, datos.length, true); lh.setUint32(22, datos.length, true); lh.setUint16(26, nombre.length, true); lh.setUint16(28, 0, true);
    partes.push(lh, nombre, datos);
    const ch = new DataView(new ArrayBuffer(46));          // entrada del directorio central
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, hora, true); ch.setUint16(14, fecha, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, datos.length, true); ch.setUint32(24, datos.length, true); ch.setUint16(28, nombre.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch, nombre);
    offset += 30 + nombre.length + datos.length;
  }
  const tamCentral = central.reduce((s, p) => s + p.byteLength, 0);
  const fin = new DataView(new ArrayBuffer(22));           // fin del directorio central
  fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, archivos.length, true); fin.setUint16(10, archivos.length, true);
  fin.setUint32(12, tamCentral, true); fin.setUint32(16, offset, true);
  return new Blob([...partes, ...central, fin], { type: 'application/zip' });
}
// Lee ZIPs propios y también comprimidos (deflate) si el navegador tiene DecompressionStream.
async function leerZip(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer()), dv = new DataView(buf.buffer);
  let e = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('No es un ZIP válido');
  const n = dv.getUint16(e + 10, true), dec = new TextDecoder(), mapa = new Map();
  let p = dv.getUint32(e + 16, true);
  for (let k = 0; k < n; k++) {
    const metodo = dv.getUint16(p + 10, true), tam = dv.getUint32(p + 20, true);
    const ln = dv.getUint16(p + 28, true), lx = dv.getUint16(p + 30, true), lc = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const nombre = dec.decode(buf.subarray(p + 46, p + 46 + ln));
    const ini = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    mapa.set(nombre, { metodo, datos: buf.subarray(ini, ini + tam) });
    p += 46 + ln + lx + lc;
  }
  return {
    nombres: [...mapa.keys()],
    async bytes(nombre) {
      const a = mapa.get(nombre);
      if (!a) return null;
      if (a.metodo === 0) return a.datos;
      if (a.metodo === 8) {
        if (!('DecompressionStream' in window)) throw new Error('Este navegador no puede abrir ZIP comprimidos. Usá el JSON.');
        const s = new Blob([a.datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return new Uint8Array(await new Response(s).arrayBuffer());
      }
      throw new Error('Tipo de compresión no soportado');
    },
    async texto(nombre) { const b = await this.bytes(nombre); return b ? dec.decode(b) : null; },
  };
}
// ZIP completo: recetario.json + recetario.md + un .md por receta + CSV + carpeta de fotos.

const blobADataURL = b => new Promise((ok, mal) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => mal(fr.error); fr.readAsDataURL(b); });
function dataURLABlob(u) {
  const [cab, datos] = u.split(','); const tipo = cab.match(/:(.*?);/)[1];
  const bin = atob(datos), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: tipo });
}
// Arma el objeto de respaldo. fotos: 'base64' (dentro del JSON) o 'archivos' (para el ZIP).
async function armarDatosRespaldo(modoFotos = 'base64') {
  const fotos = await DB.all('fotos');
  const datos = {
    app: 'recetario-manolo', formato: 1, version: APP_VERSION, exportado: new Date().toISOString(),
    sectores: S.sectores, recetas: S.recetas, insumos: await DB.all('insumos'),
    ajustes: { diasAviso: S.meta.diasAviso ?? DIAS_AVISO_RESPALDO },
    fotos: [],
  };
  for (const f of fotos) {
    if (modoFotos === 'base64') datos.fotos.push({ id: f.id, recetaId: f.recetaId, data: await blobADataURL(f.blob) });
    else datos.fotos.push({ id: f.id, recetaId: f.recetaId, archivo: nombreArchivoFoto(f) , _blob: f.blob });
  }
  return datos;
}
function nombreArchivoFoto(f) { const r = getReceta(f.recetaId); return `fotos/${slug(r ? r.nombre : 'sin-receta')}-${f.id}.jpg`; }
const sello = () => hoyISO();

// Comparte un archivo con el menú del celular; si no se puede, lo descarga.
// Chrome en Android solo comparte algunos tipos (txt, csv, imágenes, pdf…), por eso
// si el tipo real no se puede compartir se prueba como texto plano.
async function compartirArchivo(blob, nombre, { titulo = nombre, comoTexto = false } = {}) {
  const intentos = [new File([blob], nombre, { type: blob.type })];
  if (comoTexto) intentos.push(new File([blob], nombre + '.txt', { type: 'text/plain' }));
  const archivo = intentos.find(f => navigator.canShare && navigator.canShare({ files: [f] }));
  if (archivo) {
    try { await navigator.share({ files: [archivo], title: titulo }); return true; }
    catch (e) {
      if (e.name === 'AbortError') return false;
      if (e.name === 'NotAllowedError') {   // se venció el "toque" del usuario mientras se generaba: pedimos otro
        const ok = await modal({ titulo: 'Archivo listo', cuerpo: `<p>${esc(nombre)}</p>`, botones: [{ txt: 'Compartir', ico: 'compartir', valor: true }, { txt: 'Descargar', ico: 'descarga', valor: 'd', clase: 'sec' }] });
        if (ok === true) { try { await navigator.share({ files: [archivo], title: titulo }); return true; } catch (e2) { if (e2.name === 'AbortError') return false; } }
        else if (ok !== 'd') return false;
      }
    }
  }
  descargar(blob, nombre);
  toast('Archivo descargado: ' + nombre, { ms: 5000 });
  return true;
}

// Lee un archivo de respaldo (JSON o ZIP) y devuelve los datos con las fotos como Blob.
async function leerRespaldo(file) {
  const cabecera = new Uint8Array(await file.slice(0, 2).arrayBuffer());
  let datos;
  if (cabecera[0] === 0x50 && cabecera[1] === 0x4B) {          // "PK" = ZIP
    const z = await leerZip(file);
    const nJson = z.nombres.find(n => /(^|\/)recetario\.json$/.test(n)) || z.nombres.find(n => n.endsWith('.json'));
    if (!nJson) throw new Error('El ZIP no tiene recetario.json');
    const base = nJson.slice(0, nJson.lastIndexOf('/') + 1);
    datos = JSON.parse(await z.texto(nJson));
    for (const f of datos.fotos || []) { const b = await z.bytes(base + f.archivo); f.blob = b ? new Blob([b], { type: 'image/jpeg' }) : null; }
  } else {
    datos = JSON.parse(await file.text());
    for (const f of datos.fotos || []) f.blob = f.data ? dataURLABlob(f.data) : null;
  }
  if (!Array.isArray(datos.recetas) || !Array.isArray(datos.sectores)) throw new Error('El archivo no es un respaldo del recetario');
  datos.fotos = (datos.fotos || []).filter(f => f.blob).map(f => ({ id: f.id, recetaId: f.recetaId, blob: f.blob, creada: f.creada || datos.exportado }));
  return datos;
}
async function restaurar(file) {

      <p><b>Combinar</b> suma lo del respaldo a lo que ya tenés (si una receta está en los dos, te pregunto).<br><b>Reemplazar</b> borra todo lo actual.</p>`,
    botones: [{ txt: 'Combinar con lo actual', ico: 'combinar', valor: 'combinar' }, { txt: 'Reemplazar todo', ico: 'refrescar', valor: 'reemplazar', clase: 'peligro' }, { txt: 'Cancelar', valor: null, clase: 'sec' }],
  });
  if (!modo) return;
  try {

      for (const s of ['sectores', 'recetas', 'fotos', 'insumos']) await DB.clear(s);
      await DB.putVarios('sectores', datos.sectores);

      for (const f of datos.fotos) await DB.put('fotos', f);

    }
  } catch (e) { await modal({ titulo: 'Error al restaurar', cuerpo: `<p>${esc(e.message)}</p>` }); }
  location.hash = '#/';

// Combina un respaldo con los datos actuales, preguntando en cada conflicto.
async function combinar(datos) {
  const res = { nuevas: 0, reemplazadas: 0, duplicadas: 0, conservadas: 0 };
  // Sectores: se reconocen por id o por nombre.
  const mapaSector = {};
  for (const s of datos.sectores) {
    const local = getSector(s.id) || S.sectores.find(x => norm(x.nombre) === norm(s.nombre));
    if (local) mapaSector[s.id] = local.id;
    else { const n = { ...s, orden: S.sectores.length }; await guardarSector(n); mapaSector[s.id] = n.id; }
  }
  const fotosDe = id => datos.fotos.filter(f => f.recetaId === id);
  // Guarda una receta del respaldo; con nuevoId=true le cambia el id (y a sus fotos).
  const importar = async (r, nuevoId) => {
    const fotos = fotosDe(r.id);
    if (nuevoId) {
      const mapa = {}; r.id = uid();
      for (const f of fotos) { mapa[f.id] = uid(); }
      r.fotoIds = r.fotoIds.map(x => mapa[x] || x);
      r.pasos.forEach(p => { if (p.fotoId) p.fotoId = mapa[p.fotoId] || p.fotoId; });
      for (const f of fotos) await DB.put('fotos', { ...f, id: mapa[f.id], recetaId: r.id });
    } else for (const f of fotos) await DB.put('fotos', f);
    await guardarReceta(r, { tocar: false });
  };
  let paraTodas = null;
  for (const r of structuredClone(datos.recetas.map(x => ({ ...x })))) {
    r.sectorId = mapaSector[r.sectorId] || r.sectorId;
    const existe = getReceta(r.id) || S.recetas.find(x => norm(x.nombre) && norm(x.nombre) === norm(r.nombre) && x.sectorId === r.sectorId);
    if (!existe) { await importar(r, false); res.nuevas++; continue; }
    if (existe.id === r.id && existe.modificada === r.modificada) { res.conservadas++; continue; }
    let d = paraTodas;
    if (!d) {
      const resumen = x => `${plural(x.ingredientes.length, 'ingrediente', 'ingredientes')}, ${plural(x.pasos.length, 'paso', 'pasos')}, modificada ${new Date(x.modificada).toLocaleString('es-AR')}`;
      let chk;
      d = await modal({
        titulo: `"${r.nombre || 'sin nombre'}" ya existe`,
        cuerpo: `<p><b>La tuya:</b> ${esc(resumen(existe))}</p><p><b>La del respaldo:</b> ${esc(resumen(r))}</p>
          <label class="check"><input type="checkbox" id="mTodas"> Hacer lo mismo con las que siguen</label>`,
        botones: [{ txt: 'Conservar la mía', valor: 'mia', clase: 'sec' }, { txt: 'Usar la del respaldo', valor: 'respaldo', clase: 'sec' }, { txt: 'Guardar las dos', valor: 'ambas' }],
        alAbrir: dl => chk = $('#mTodas', dl),
      }) || 'mia';
      if (chk.checked) paraTodas = d;
    }
    if (d === 'mia') res.conservadas++;
    else if (d === 'respaldo') {
      if (existe.id !== r.id) await borrarReceta(existe);
      else for (const fid of idsFotosDeReceta(existe)) if (!idsFotosDeReceta(r).includes(fid)) await DB.del('fotos', fid);
      await importar(r, false); res.reemplazadas++;
    } else {
      if (existe.id === r.id) r.nombre = (r.nombre || 'Receta') + ' (del respaldo)';
      await importar(r, existe.id === r.id); res.duplicadas++;
    }
  }
  for (const i of datos.insumos || []) await DB.put('insumos', i);
  return res;
}

      <button class="btn sec ancho" data-acc="restaurar">${ic('carpeta')} Restaurar desde un respaldo (JSON o ZIP)</button></div>
    <div class="tarjeta"><h2 style="margin-top:0">Exportar</h2>
      <button class="btn sec ancho" data-acc="expZip">${ic('zip')} Todo en ZIP (Markdown + JSON + fotos)</button>
      <button class="btn sec ancho" data-acc="respaldar">${ic('archivo')} Todo en JSON (con fotos)</button>
      <button class="btn sec ancho" data-acc="expMdTodo">${ic('libro')} Recetario completo en Markdown</button>
      <button class="btn sec ancho" data-acc="expMdCopiar">${ic('copiar')} Copiar recetario (para pegar en un asistente de IA)</button>
      <div class="fila" style="margin:6px 0"><select id="expSector" aria-label="Sector a exportar">${S.sectores.map(s => `<option value="${s.id}">${esc(s.nombre)}</option>`).join('')}</select>
        <button class="btn sec" data-acc="expMdSector" style="flex:0 0 auto">${ic('archivo')} .md</button></div>
      <button class="btn sec ancho" data-acc="expCsv">${ic('planilla')} Planilla de ingredientes (CSV)</button>
      <p class="peq">El CSV usa ";" como separador y coma decimal: abre directo en Excel o Google Sheets en español.</p></div>`;
  setAcciones('');
  const md = (texto, nombre) => compartirArchivo(new Blob([texto], { type: 'text/markdown' }), nombre, { comoTexto: true });
  accionesVista = {
    expZip: () => exportarZip().catch(e => toast('Error: ' + e.message, { ms: 8000 })),
    expMdTodo: () => md(mdRecetario(), `recetario-${sello()}.md`),
    expMdCopiar: () => copiarTexto(mdRecetario()),
    expMdSector: () => { const id = $('#expSector').value; md(mdSector(id), `recetas-${slug(nombreSector(id))}-${sello()}.md`); },
    expCsv: () => compartirArchivo(new Blob([csvIngredientes()], { type: 'text/csv' }), `ingredientes-${sello()}.csv`),
    restaurar() {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,.zip,.txt,application/json,application/zip,text/plain';
      inp.onchange = () => inp.files[0] && restaurar(inp.files[0]);
      inp.click();
    },
  };
}

/* =====================================================================
   15. INICIO DE LA APP
   ===================================================================== */
async function crearSectoresIniciales() {
  if (S.sectores.length || S.meta.sectoresCreados) return;
  for (const [i, nombre] of SECTORES_INICIALES.entries()) await guardarSector({ id: uid(), nombre, orden: i });
  await setMeta('sectoresCreados', true);
}
function registrarServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const avisar = w => toast('Hay una versión nueva de la app', { accion: 'Actualizar', fn: () => w.postMessage('SKIP_WAITING'), ms: 0 });
    if (reg.waiting && navigator.serviceWorker.controller) avisar(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) avisar(w); });
    });
  }).catch(e => console.warn('SW no registrado', e));
  // Recargar solo si es una ACTUALIZACIÓN (ya había un service worker controlando).
  // En la primera visita el SW toma el control y no hace falta recargar.
  const habiaControlador = !!navigator.serviceWorker.controller;
  let recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!habiaControlador || recargando) return; recargando = true;
    Autoguardado.flush().then(() => location.reload());
  });
}
(async function iniciar() {
  try {
    await DB.abrir();
    await cargarTodo();
    await crearSectoresIniciales();
  } catch (e) {
    app.innerHTML = `<div class="aviso">No se pudo abrir la base de datos: ${esc(e.message)}.<br>¿Estás en modo incógnito o con el almacenamiento bloqueado?</div>`;
    return;
  }
  if (navigator.storage && navigator.storage.persist) {
    S.persistido = await navigator.storage.persisted();
    if (!S.persistido) S.persistido = await navigator.storage.persist().catch(() => false);
  }
  registrarServiceWorker();
  navegar();
})();
</script>
